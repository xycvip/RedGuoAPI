name: 清理工作流运行记录

on:
  workflow_dispatch:
    inputs:
      clean_all:
        description: '勾选：清理全部已完成记录；不勾选：只清理失败、取消等异常记录'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: 清理 Actions 运行记录
    runs-on: ubuntu-latest
    steps:
      - name: 清理运行记录
        uses: actions/github-script@v7
        with:
          script: |
            const cleanAll = ${{ inputs.clean_all }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 只处理已完成的运行记录，当前正在执行的清理任务不会被删除。
            const errorConclusions = new Set([
              'failure',
              'cancelled',
              'timed_out',
              'action_required',
              'stale',
              'startup_failure'
            ]);

            let page = 1;
            let scanned = 0;
            let deleted = 0;
            let kept = 0;
            const failures = [];
            const targets = [];

            core.info(cleanAll
              ? '模式：清理全部已完成的工作流运行记录'
              : '模式：只清理失败、取消、超时等异常运行记录');

            // 先完整收集待删除 ID，再执行删除，避免删除第一页后分页位置变化而漏删。
            while (true) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page
              });

              const runs = response.data.workflow_runs || [];
              if (runs.length === 0) break;

              scanned += runs.length;

              for (const run of runs) {
                if (run.status !== 'completed') {
                  kept++;
                  continue;
                }

                const shouldDelete = cleanAll
                  ? true
                  : errorConclusions.has(run.conclusion);

                if (shouldDelete) {
                  targets.push({ id: run.id, name: run.name, conclusion: run.conclusion });
                } else {
                  kept++;
                }
              }

              if (runs.length < 100) break;
              page++;
            }

            for (const run of targets) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deleted++;
                core.info('已删除：#' + run.id + ' ' + run.name + '（' + run.conclusion + '）');
              } catch (error) {
                failures.push({ id: run.id, message: error.message });
                core.warning('删除失败：#' + run.id + '：' + error.message);
              }
            }

            await core.summary
              .addHeading('工作流运行记录清理结果')
              .addTable([
                [{ data: '项目', header: true }, { data: '数量', header: true }],
                ['扫描记录', String(scanned)],
                ['成功删除', String(deleted)],
                ['保留记录（含运行中任务）', String(kept)],
                ['删除失败', String(failures.length)]
              ])
              .addRaw(cleanAll
                ? '\n清理模式：全部已完成记录'
                : '\n清理模式：仅异常记录')
              .write();

            if (failures.length > 0) {
              core.setFailed('有 ' + failures.length + ' 条记录删除失败，请查看日志。');
            } else {
              core.info('清理完成，共删除 ' + deleted + ' 条运行记录。');
            }
