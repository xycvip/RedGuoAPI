name: 发布客户端脚本

# 只在主脚本变化时自动发布；dist 的提交不会再次触发本工作流。
on:
  push:
    branches: [main]
    paths:
      - "script/main.js"
      - ".github/scripts/build_dist.py"
      - ".github/workflows/publish-script.yml"
      - "tests/validate_main_js.py"
  workflow_dispatch:
    # 手动运行时可指定版本号；留空则自动在上一版基础上 +0.0.1（初始 1.0.0）。
    # 无论填什么，JS 文件里手写的版本号一律不读取。
    inputs:
      version:
        description: "版本号（如 2.0.0 或 v2.0.0），留空自动 +0.0.1 递增"
        required: false
        type: string
        default: ""

permissions:
  contents: write

# 串行发布，并且每次都从最新 main 检出，避免排队任务拿旧提交推送导致非快进失败。
concurrency:
  group: publish-script
  cancel-in-progress: false

jobs:
  publish:
    name: 构建、校验并发布脚本
    runs-on: ubuntu-latest
    steps:
      - name: 检出最新 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 QuickJS 检查器
        run: python -m pip install --disable-pip-version-check quickjs==1.19.4

      - name: QuickJS 编译与宿主接口契约检查
        run: python tests/validate_main_js.py

      - name: 校验 Python
        run: python3 --version

      - name: 生成 dist
        run: python3 .github/scripts/build_dist.py
        env:
          VERSION_INPUT: ${{ inputs.version }}

      - name: 校验发布文件
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          source = Path("script/main.js").read_bytes()
          target = Path("dist/hongguoTV/HongGuoTV.js").read_bytes()
          manifest = json.loads(Path("dist/index.json").read_text(encoding="utf-8"))
          script = manifest["script"]

          assert source == target, "dist 脚本与源码不是字节级一致"
          assert script["path"] == "dist/hongguoTV/HongGuoTV.js"
          assert script["size"] == len(target), "清单 size 不匹配"
          assert script["sha256"] == hashlib.sha256(target).hexdigest(), "清单 SHA256 不匹配"
          assert manifest["schema"] == 1, "客户端不支持的清单 schema"
          assert manifest["packageName"] == "com.x.hongguotv.bate", "packageName 意外变化"
          assert re.fullmatch(r"v\d+\.\d+\.\d+-\d{8}", script["version"]), "版本号格式不符合客户端契约"
          print(f"校验通过：{script['version']} / {len(target)} bytes / {script['sha256']}")
          PY

      - name: 提交发布产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --staged --quiet; then
            echo "发布产物没有变化，无需提交"
            exit 0
          fi
          git commit -m "dist: publish client script"
          git push origin HEAD:main
