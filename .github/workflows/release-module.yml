name: 模块自动发布

on:
  workflow_run:
    workflows: ["上游模块自动同步"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "modules-all/**"
      - "allindex.json"
  workflow_dispatch:
    inputs:
      module_id:
        description: 可选：填写模块 ID 只发布该模块；留空则全量检查并发布所有模块
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: module-auto-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 识别需要发布的模块
        id: candidates
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          MODULE_ID: ${{ inputs.module_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          selected = set()
          if event == "push":
              before, after = os.environ.get("BEFORE_SHA", ""), os.environ.get("AFTER_SHA", "")
              if before and after and not set(before) == {"0"}:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", before, after], text=True
                  ).splitlines()
                  for path in changed:
                      m = re.match(r"^modules-all/([^/]+)/", path)
                      if m:
                          selected.add(m.group(1))
                      elif path == "allindex.json":
                          data = json.loads(Path("allindex.json").read_text(encoding="utf-8"))
                          selected.update(x.get("id", "") for x in data.get("modules", []) if isinstance(x, dict))
          elif event == "workflow_dispatch":
              requested = os.environ.get("MODULE_ID", "").strip()
              if requested:
                  selected.add(requested)
              else:
                  # 手动运行且未填写模块 ID：只扫描全量模块索引
                  catalog_path = Path("allindex.json")
                  if catalog_path.exists():
                      data = json.loads(catalog_path.read_text(encoding="utf-8"))
                      selected.update(
                          entry.get("id", "") for entry in data.get("modules", [])
                          if isinstance(entry, dict)
                      )
          else:
              # 上游自动同步完成后：只处理本轮新增或更新的模块
              log_path = Path("sync-log.json")
              if log_path.exists():
                  log = json.loads(log_path.read_text(encoding="utf-8"))
                  runs = log.get("runs", [])
                  if runs:
                      latest = runs[-1]
                      selected.update(latest.get("added", []))
                      selected.update(latest.get("updated", []))

          # 最终白名单：必须同时存在于 allindex.json 和 modules-all/<ID>/
          catalog_path = Path("allindex.json")
          allowed = set()
          if catalog_path.exists():
              data = json.loads(catalog_path.read_text(encoding="utf-8"))
              allowed = {
                  x.get("id", "") for x in data.get("modules", [])
                  if isinstance(x, dict) and isinstance(x.get("id"), str)
              }
          selected = sorted(
              x for x in selected
              if re.fullmatch(r"[a-z0-9][a-z0-9-]*", x)
              and x in allowed
              and (Path("modules-all") / x).is_dir()
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("modules=" + ",".join(selected) + "\n")
          print("待检查模块：" + (", ".join(selected) if selected else "无"))
          PY

      - name: 发布有新版本的模块
        if: steps.candidates.outputs.modules != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODULES: ${{ steps.candidates.outputs.modules }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess, zipfile
          from urllib.parse import quote
          from datetime import date
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          modules = [x for x in os.environ["MODULES"].split(",") if x]
          catalogs = [
              (Path("allindex.json"), Path("modules-all")),
          ]
          changed_catalogs = set()

          def gh(*args, check=True):
              return subprocess.run(["gh", *args], text=True, capture_output=True, check=check)

          for module_id in modules:
              try:
                  found = None
                  for catalog_path, root in catalogs:
                      data = json.loads(catalog_path.read_text(encoding="utf-8"))
                      entry = next((x for x in data.get("modules", []) if x.get("id") == module_id), None)
                      if entry:
                          found = (catalog_path, root, data, entry)
                          break
                  if not found:
                      print(f"[SKIP] {module_id}: 两个索引中均不存在")
                      continue

                  catalog_path, root, data, entry = found
                  folder = root / module_id
                  manifest_path, main_path = folder / "manifest.json", folder / "main.js"
                  if not manifest_path.is_file() or not main_path.is_file():
                      print(f"[SKIP] {module_id}: 缺少 manifest.json 或 main.js")
                      continue

                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  version = manifest.get("version")
                  module_name = str(manifest.get("name") or module_id).strip()
                  if manifest.get("id") != module_id or not isinstance(version, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version):
                      print(f"[SKIP] {module_id}: manifest ID 或 x.y.z 版本号无效")
                      continue
                  manifest_bytes, main_bytes = manifest_path.read_bytes(), main_path.read_bytes()
                  hashes = {
                      "manifest.json": hashlib.sha256(manifest_bytes).hexdigest(),
                      "main.js": hashlib.sha256(main_bytes).hexdigest(),
                  }
                  old_hashes = entry.get("sha256", {})
                  old_release = entry.get("releaseTag", entry.get("tag", ""))

                  tag = f"{module_id}-v{version}"
                  asset_filename = f"{module_id}-{version}.zip"

                  def make_archive():
                      archive_path = Path(asset_filename)
                      with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as z:
                          z.write(manifest_path, "manifest.json")
                          z.write(main_path, "main.js")
                      return archive_path

                  # 必须先检查 GitHub 上的真实 Release 状态，不能仅凭索引旧记录判断已发布。
                  existing = gh("release", "view", tag, check=False)
                  if existing.returncode == 0:
                      # Release 真实存在且索引记录同一版本时，源码变化必须先提升版本，不能把新内容塞进旧版本附件。
                      if old_release == tag and old_hashes != hashes:
                          print(f"[VERSION-NOT-BUMPED] {module_id}: 源码已变化，但 manifest.version 仍为 {version}；请上游提升版本号后再发布")
                          continue

                      release_info = gh("api", f"repos/{repository}/releases/tags/{tag}")
                      release_data = json.loads(release_info.stdout)
                      asset = next((a for a in release_data.get("assets", []) if a.get("name") == asset_filename), None)

                      if not asset:
                          # Release 存在但附件丢失：只补传缺失附件，不删除或覆盖其他附件。
                          archive = make_archive()
                          upload = gh("release", "upload", tag, str(archive), check=False)
                          if upload.returncode != 0:
                              print(f"[ERROR] {module_id}: Release {tag} 的附件补传失败：{upload.stderr.strip()}")
                              continue
                          release_info = gh("api", f"repos/{repository}/releases/tags/{tag}")
                          release_data = json.loads(release_info.stdout)
                          asset = next((a for a in release_data.get("assets", []) if a.get("name") == asset_filename), None)
                          if not asset:
                              print(f"[ERROR] {module_id}: 附件补传后仍未通过核验")
                              continue
                          repaired_action = "缺失附件已补传"
                      else:
                          repaired_action = "已有 Release 与附件"

                      if old_release == tag and old_hashes == hashes and entry.get("assetName") == asset_filename and entry.get("assetUrl") and entry.get("tag") == tag:
                          print(f"[UNCHANGED] {module_id} {version}: Release、附件及文件指纹均未变化")
                          continue

                      entry["version"] = version
                      entry["tag"] = tag
                      entry["releaseTag"] = tag
                      entry["repo"] = repository
                      entry["path"] = f"{root.as_posix()}/{module_id}"
                      entry["sha256"] = hashes
                      entry["assetName"] = asset_filename
                      entry["assetUrl"] = asset.get("browser_download_url") or f"https://github.com/{repository}/releases/download/{tag}/{quote(asset_filename, safe='')}"
                      data["generatedAt"] = date.today().isoformat()
                      catalog_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                      changed_catalogs.add(catalog_path)
                      print(f"[REPAIRED] {module_id} {version}: {repaired_action}，索引元数据已核验并补齐")
                      continue

                  # GitHub 上不存在该版本 Release：即使索引保留旧 tag/hash，也按首次发布创建。
                  archive = make_archive()

                  notes = f"模块：{module_name}\n版本：{version}\n\n由 RedGuoAPI 自动检测上游更新并发布。ZIP 仅包含 manifest.json 和 main.js。"
                  result = gh("release", "create", tag, str(archive), "--title", f"{module_name} v{version}", "--notes", notes)
                  if result.returncode != 0:
                      print(f"[ERROR] {module_id}: 发布失败：{result.stderr.strip()}")
                      continue

                  # CLI 使用 ASCII 临时名上传，再用 GitHub API 改为模块 ID+版本号并验证。
                  release_info = gh("api", f"repos/{repository}/releases/tags/{tag}")
                  release_data = json.loads(release_info.stdout)
                  uploaded = next((a for a in release_data.get("assets", []) if a.get("name") == archive.name), None)
                  if not uploaded:
                      print(f"[ERROR] {module_id}: Release 已创建，但找不到刚上传的 ZIP 附件")
                      continue
                  patch = gh("api", "--method", "PATCH", f"repos/{repository}/releases/assets/{uploaded['id']}", "-f", f"name={asset_filename}", check=False)
                  if patch.returncode != 0:
                      print(f"[ERROR] {module_id}: Release 已创建，但附件改名失败：{patch.stderr.strip()}")
                      continue
                  patched = json.loads(patch.stdout)
                  if patched.get("name") != asset_filename:
                      print(f"[ERROR] {module_id}: 附件名验证失败，实际为 {patched.get('name')}")
                      continue

                  entry["version"] = version
                  entry["tag"] = tag
                  entry["releaseTag"] = tag
                  entry["repo"] = repository
                  entry["path"] = f"{root.as_posix()}/{module_id}"
                  entry["sha256"] = hashes
                  entry["assetName"] = asset_filename
                  entry["assetUrl"] = f"https://github.com/{repository}/releases/download/{tag}/{quote(asset_filename, safe='')}"
                  data["generatedAt"] = date.today().isoformat()
                  catalog_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  changed_catalogs.add(catalog_path)
                  print(f"[PUBLISHED] {module_id} {version} -> {tag}")
              except Exception as exc:
                  print(f"[ERROR] {module_id}: {type(exc).__name__}: {exc}")

          if changed_catalogs:
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", "index.json", "allindex.json"], check=True)
              diff = subprocess.run(["git", "diff", "--cached", "--quiet"])
              if diff.returncode != 0:
                  subprocess.run(["git", "commit", "-m", "chore(release): 自动更新模块发布索引"], check=True)
                  subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          print("模块自动发布检查完成。")
          PY
